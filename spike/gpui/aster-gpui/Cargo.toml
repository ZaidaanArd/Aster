[package]
name = "aster-gpui"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "83df5df635ed97ca6425d16659ad0307865ed93b", package = "gpui" }
raw-window-handle = "0.6.2"

[target.'cfg(target_os = "windows")'.dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "83df5df635ed97ca6425d16659ad0307865ed93b", package = "gpui_platform" }
tray-icon = "0.26.1"
windows = { version = "0.61.0", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[target.'cfg(target_os = "macos")'.dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "83df5df635ed97ca6425d16659ad0307865ed93b", package = "gpui_platform", features = ["font-kit"] }

[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "83df5df635ed97ca6425d16659ad0307865ed93b", package = "gpui_platform", features = ["font-kit", "x11", "wayland"] }
